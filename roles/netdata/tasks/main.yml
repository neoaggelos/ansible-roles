---
- name: set ansible_distribution fact
  setup:
    gather_subset: hardware
    filter: ansible_distribution
  when: ansible_distribution is not defined
  tags: [netadata]

- name: validate netdata repository configuration
  assert:
    that:
      - ansible_distribution in ['Debian', 'Ubuntu']
      - netdata_repository_channel in ['stable', 'edge']
    fail_msg: >-
      The Netdata repository supports Debian and Ubuntu with either the stable
      or edge release channel.
  tags: [netdata, repository]

- name: install netdata repository signing key
  get_url:
    url: "{{ netdata_repository_signing_key_url }}"
    dest: "{{ netdata_repository_signing_key_path }}"
    mode: "0644"
    owner: root
    group: root
  tags: [netdata, repository]

- name: add netdata repository
  apt_repository:
    repo: >-
      deb [signed-by={{ netdata_repository_signing_key_path }} by-hash=yes]
      {{ netdata_repository_url }}/ {{ ansible_distribution_release }}/
    filename: netdata
    state: present
    update_cache: true
  tags: [netdata, repository]

- name: install netdata
  apt:
    name: netdata
    state: present
    update_cache: true
    cache_valid_time: "{{ netdata_apt_cache_valid_time }}"
  tags: [netdata, packages]

- name: enable netdata service
  service:
    name: netdata
    enabled: true
    state: started
  tags: [netdata, service]

- name: configure alarms
  template:
    src: health_alarm_notify.conf.j2
    dest: "{{ netdata_conf_dir }}/health_alarm_notify.conf"
    mode: "0640"
    owner: root
    group: netdata
  notify:
    - restart netdata
  tags: [netdata, config]

- name: configure netdata.conf
  blockinfile:
    path: "{{ netdata_conf_dir }}/netdata.conf"
    block: "{{ netdata_conf }}"
    marker: "## {mark} ANSIBLE MANAGED CONFIGURATION"
  notify:
    - restart netdata
  tags: [netdata, config]

- name: opt out from anonymous statistics
  file:
    path: "{{ netdata_conf_dir }}/.opt-out-from-anonymous-statistics"
    state: touch
    modification_time: preserve
    access_time: preserve
    owner: root
    group: root
    mode: "0400"
  notify:
    - restart netdata
  tags: [netdata, config]

- name: create netdata conf files
  when: item.state | default('present') == 'present'
  template:
    src: "{{ item.template }}"
    dest: "{{ netdata_conf_dir }}/{{ item.name }}"
    mode: "{{ item.mode | default('0640') }}"
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default('netdata') }}"
  loop: "{{ netdata_conf_files }}"
  notify:
    - restart netdata
  tags: [netdata, config]

- name: remove absent netdata conf files
  when: item.state | default('present') == 'absent'
  file:
    dest: "{{ netdata_conf_dir }}/{{ item.name }}"
    state: absent
  loop: "{{ netdata_conf_files }}"
  notify:
    - restart netdata
  tags: [netdata, config]

- name: ensure netdata cloud conf directory
  file:
    path: "{{ netdata_cloud_conf_dir }}"
    state: directory
    mode: "0770"
    owner: "netdata"
    group: "netdata"
  tags: [netdata, config]

- name: configure cloud.conf
  blockinfile:
    path: "{{ netdata_cloud_conf_dir }}/cloud.conf"
    block: "{{ netdata_cloud_conf }}"
    marker: "## {mark} ANSIBLE MANAGED CONFIGURATION"
    create: true
    mode: "0770"
    owner: "netdata"
    group: "netdata"
  notify:
    - restart netdata
  tags: [netdata, config]
